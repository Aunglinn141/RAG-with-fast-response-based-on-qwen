<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9f8" />
    <meta name="description" content="本地 RAG 文档工作台：上传文档、管理索引、检索文字与来源。" />
    <title>本地 RAG · 文档工作台</title>
    <style>
      .startup-screen { max-width: 560px; margin: 15vh auto; padding: 32px; font: 16px/1.7 system-ui, sans-serif; color: #243b34; }
      .startup-screen h1 { font-size: 24px; }
      .startup-screen p { color: #52655e; }
      .startup-screen button { padding: 10px 18px; border: 0; border-radius: 8px; background: #315e4b; color: white; font: inherit; cursor: pointer; }
      .startup-screen pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="startup-screen" aria-live="polite">
        <h1 id="startup-title">正在打开本地知库</h1>
        <p id="startup-message">正在加载界面，请稍候。</p>
        <button id="startup-reload" type="button" hidden>重新加载</button>
        <details id="startup-details" hidden><summary>查看错误详情</summary><pre id="startup-error"></pre></details>
        <noscript><p>请在浏览器中启用 JavaScript，然后刷新页面。</p></noscript>
      </main>
    </div>
    <script type="module" src="/src/bootstrap.js"></script>
  </body>
</html>
