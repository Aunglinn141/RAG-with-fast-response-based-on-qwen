[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag"
version = "0.6.0"
description = "Local document processing and Ollama integration"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
local-rag-read = "local_rag.cli.read_document:cli"
local-rag-chunk = "local_rag.cli.chunk_document:cli"
local-rag-check = "local_rag.cli.check_ollama:cli"
local-rag-check-index = "local_rag.cli.check_index:cli"
local-rag-check-rag = "local_rag.cli.check_rag:cli"
local-rag-benchmark = "local_rag.cli.benchmark:cli"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["local_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "stability: storage, error recovery and repeated process restart contracts using synthetic embeddings",
]
